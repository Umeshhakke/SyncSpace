<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Socket.io Test</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 600px;
      margin: 2rem auto;
      padding: 1rem;
      background: #f5f7fa;
    }
    h1 {
      color: #2c3e50;
      border-bottom: 2px solid #3498db;
      padding-bottom: 0.5rem;
    }
    .status {
      background: #ecf0f1;
      padding: 0.75rem;
      border-radius: 8px;
      margin: 1rem 0;
      font-weight: bold;
      display: flex;
      align-items: center;
    }
    .status .dot {
      display: inline-block;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      margin-right: 10px;
    }
    .status .dot.online {
      background: #2ecc71;
    }
    .status .dot.offline {
      background: #e74c3c;
    }
    .status .dot.connecting {
      background: #f1c40f;
      animation: pulse 1s infinite;
    }
    @keyframes pulse {
      0% { opacity: 1; }
      50% { opacity: 0.3; }
      100% { opacity: 1; }
    }
    .logs {
      background: #2c3e50;
      color: #ecf0f1;
      padding: 1rem;
      border-radius: 8px;
      max-height: 250px;
      overflow-y: auto;
      font-family: 'Courier New', monospace;
      font-size: 0.9rem;
      margin: 1rem 0;
    }
    .logs .log-entry {
      margin: 0.2rem 0;
    }
    .logs .log-entry.error {
      color: #e74c3c;
    }
    .logs .log-entry.success {
      color: #2ecc71;
    }
    .logs .log-entry.info {
      color: #3498db;
    }
    .btn-group {
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
      margin: 1rem 0;
    }
    button {
      background: #3498db;
      color: white;
      border: none;
      padding: 0.6rem 1.5rem;
      border-radius: 6px;
      cursor: pointer;
      font-size: 1rem;
      transition: background 0.2s;
    }
    button:hover {
      background: #2980b9;
    }
    button:disabled {
      background: #bdc3c7;
      cursor: not-allowed;
    }
    button.danger {
      background: #e74c3c;
    }
    button.danger:hover {
      background: #c0392b;
    }
    .input-group {
      display: flex;
      gap: 0.5rem;
      margin: 0.5rem 0;
    }
    .input-group input {
      flex: 1;
      padding: 0.6rem;
      border: 1px solid #bdc3c7;
      border-radius: 6px;
      font-size: 1rem;
    }
  </style>
</head>
<body>

  <h1>🔌 Socket.io Test</h1>

  <!-- Connection status -->
  <div class="status" id="status">
    <span class="dot connecting" id="statusDot"></span>
    <span id="statusText">Connecting...</span>
  </div>

  <!-- Message log -->
  <div class="logs" id="logs">
    <div class="log-entry info">📡 Waiting for messages...</div>
  </div>

  <!-- Actions -->
  <div class="btn-group">
    <button id="sendBtn" disabled>📤 Send Test Message</button>
    <button id="reconnectBtn" class="danger">🔄 Reconnect</button>
  </div>

  <div class="input-group">
    <input type="text" id="messageInput" placeholder="Type a custom message..." />
    <button id="sendCustomBtn" disabled>Send</button>
  </div>

  <p><small>🔑 Token used: <strong>demo123</strong> (hardcoded in script)</small></p>

  <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
  <script>
    (function() {
      // DOM refs
      const statusDot = document.getElementById('statusDot');
      const statusText = document.getElementById('statusText');
      const logsDiv = document.getElementById('logs');
      const sendBtn = document.getElementById('sendBtn');
      const reconnectBtn = document.getElementById('reconnectBtn');
      const messageInput = document.getElementById('messageInput');
      const sendCustomBtn = document.getElementById('sendCustomBtn');

      let socket = null;

      // Helper: add log entry
      function addLog(message, type = 'info') {
        const entry = document.createElement('div');
        entry.className = `log-entry ${type}`;
        entry.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
        logsDiv.appendChild(entry);
        logsDiv.scrollTop = logsDiv.scrollHeight;
      }

      // Helper: update status
      function setStatus(text, type) {
        statusText.textContent = text;
        statusDot.className = 'dot';
        if (type === 'online') {
          statusDot.classList.add('online');
        } else if (type === 'offline') {
          statusDot.classList.add('offline');
        } else {
          statusDot.classList.add('connecting');
        }
      }

      // Connect function
      function connectSocket() {
        if (socket && socket.connected) {
          addLog('Already connected. Use "Reconnect" to reset.', 'info');
          return;
        }

        // Close any existing socket
        if (socket) {
          socket.disconnect();
          socket = null;
        }

        setStatus('Connecting...', 'connecting');
        addLog('⏳ Connecting with token: demo123', 'info');

        // Create new connection WITH AUTH TOKEN
        socket = io('http://localhost:3000', {
          auth: {
            token: 'demo123'
          }
        });

        // ---- Event listeners ----

        socket.on('connect', () => {
          setStatus('✅ Connected', 'online');
          addLog(`✅ Connected! Socket ID: ${socket.id}`, 'success');
          sendBtn.disabled = false;
          sendCustomBtn.disabled = false;
        });

        socket.on('connect_error', (err) => {
          setStatus('❌ Connection Error', 'offline');
          addLog(`❌ Connection error: ${err.message}`, 'error');
          sendBtn.disabled = true;
          sendCustomBtn.disabled = true;
        });

        socket.on('disconnect', (reason) => {
          setStatus('❌ Disconnected', 'offline');
          addLog(`❌ Disconnected: ${reason}`, 'error');
          sendBtn.disabled = true;
          sendCustomBtn.disabled = true;
        });

        // Listen for any incoming messages (we'll echo them)
        socket.on('message', (data) => {
          addLog(`📩 Server says: ${data}`, 'success');
        });

        // Optional: listen for a custom event if your server sends one
        socket.on('welcome', (data) => {
          addLog(`👋 Welcome message: ${data}`, 'info');
        });
      }

      // Send a test message
      function sendTestMessage() {
        if (!socket || !socket.connected) {
          addLog('❌ Not connected to server.', 'error');
          return;
        }
        const msg = messageInput.value.trim() || 'Hello from browser!';
        socket.emit('message', msg);
        addLog(`📤 Sent: "${msg}"`, 'info');
        messageInput.value = '';
      }

      // Reconnect (force close and open new)
      function reconnect() {
        if (socket) {
          socket.disconnect();
          socket = null;
        }
        // Clear logs (optional) – or keep them
        // logsDiv.innerHTML = '';
        addLog('🔄 Reconnecting...', 'info');
        connectSocket();
      }

      // ---- Wire up buttons ----
      sendBtn.addEventListener('click', () => {
        // Send a default message
        socket.emit('message', 'Test from button');
        addLog('📤 Sent: "Test from button"', 'info');
      });

      sendCustomBtn.addEventListener('click', sendTestMessage);
      messageInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') sendTestMessage();
      });

      reconnectBtn.addEventListener('click', reconnect);

      // ---- Initial connection ----
      connectSocket();

      // Cleanup on page unload (optional)
      window.addEventListener('beforeunload', () => {
        if (socket) socket.disconnect();
      });

    })();
  </script>

</body>
</html>
